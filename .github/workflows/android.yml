name: Crear APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar aplicación web
        run: npm run build

      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Crear configuración de Capacitor
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "Electroroite EV" "com.electroroite.ev" --web-dir dist
          fi

      - name: Añadir Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sincronizar aplicación con Android
        run: npx cap sync android

      - name: Forzar versión de Java en Gradle
        run: |
          echo "org.gradle.java.home=${JAVA_HOME}" >> android/gradle.properties

      - name: Crear APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Electroroite-EV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
